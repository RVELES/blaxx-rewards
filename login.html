<style>
  body { background: var(--paper); min-height: 100vh; display: flex; flex-direction: column; }
  /* Barra preta: a marca oficial tem "Bla" BRANCO e não sobrevive sobre o
     papel, medido aqui: 1,25:1 no "Bla" e 1,08:1 no "Xx", ou seja, a logo
     inteira era invisível nesta tela. O link auxiliar também estava em neon
     sobre claro (1,08:1). Sobre preto, ambos passam com folga.
     No tema Embarque esta barra faz o papel da barra utilitária (.bx-util):
     preta, texto no cinza da barra, sem a borda grossa do brutalismo. */
  .auth-top { display: flex; align-items: center; justify-content: space-between;
              gap: 16px; flex-wrap: wrap; padding: 18px 28px;
              background: var(--bx-ink); border-bottom: 0; }
  .auth-top img { height: 30px; width: auto; display: block; }
  .auth-top a.alt { font-size: 13.5px; font-weight: 600; color: var(--bx-bar-fg); }
  .auth-top a.alt b { color: var(--bx-neon); }   /* neon sobre preto: 14,5:1 */
  .auth-wrap { flex: 1; display: grid; place-items: center; padding: 24px; }
  .auth { width: 100%; max-width: 420px; padding: 36px; animation: rise .5s var(--ease-out) both; }
  .auth h1 { font-family: var(--font-display); font-weight: 900; font-size: 30px; letter-spacing: -0.02em; margin: 0 0 4px; }
  .auth .sub { font-size: 14px; color: var(--fg-muted); margin: 0 0 24px; }
  .f { margin-bottom: 16px; }
  .f label { display: block; font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-subtle); margin-bottom: 7px; }
  .f input { width: 100%; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--cream); padding: 13px 14px; font-family: var(--font-body); font-size: 14.5px; color: var(--fg); outline: none; transition: border-color .2s var(--ease), box-shadow .2s var(--ease); }
  /* Foco como na folha do tema: contorno tinta + anel neon translúcido. */
  .f input:focus { border-color: var(--bx-ink); box-shadow: 0 0 0 3px rgba(89,253,39,.35); }
  .row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; margin: 4px 0 20px; }
  .row a { font-weight: 700; text-decoration: underline; }
  .auth-foot { text-align: center; padding: 20px; font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); }
  .auth-foot a { text-decoration: underline; }
  /* Divisor "ou" entre login por senha e login social. */
  .auth-divider { display: flex; align-items: center; gap: 14px; margin: 20px 0; color: var(--fg-muted); font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--line, rgba(10,11,14,.15)); }
  /* O GSI injeta um iframe de largura fixa; centralizar evita o botão colado à esquerda. */
  #g-signin-btn { display: flex; justify-content: center; min-height: 44px; }
  /* ── Celular (≤ 880px) ──────────────────────────────────────────────
     Barra preta mais baixa, cartão a 16px das bordas e com 24px por
     dentro (o 36px do desktop comia um quinto da tela), formulário logo
     abaixo da barra em vez de flutuar no meio, campos a 16px (o iOS não
     amplia a tela ao focar) e cada link ou alvo com 44px de altura. Os
     links do rodapé seguem corridos; só ganham área de toque. */
  @media (max-width: 880px){
    .auth-top { padding: 8px 16px; gap: 8px 14px; min-height: 60px; }
    .auth-top a { display: inline-flex; align-items: center; min-height: 44px; }
    .auth-top a.alt { gap: .32em; }   /* o flex engole o espaço antes do <b> */
    .auth-wrap { padding: 16px 16px 24px; align-items: start; }
    .auth { padding: 24px 20px; }
    .auth h1 { font-size: 28px; }
    .auth .sub { font-size: 15px; }
    .f input { font-size: 16px; min-height: 48px; }
    .row { gap: 8px 12px; flex-wrap: wrap; }
    .row label { min-height: 44px; }
    .row input[type="checkbox"] { width: 18px; height: 18px; }
    .auth-foot { padding: 8px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
    .auth-foot a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 6px; }
  }
</style>

  <script>
  (function(){
    var DEFAULT_API = (window.BLAXX_API || 'https://blaxx-pontos-exe.onrender.com');
    function apiBase(){ try { return (localStorage.getItem('blaxx_api_url') || DEFAULT_API).replace(/\/+$/,''); } catch(e){ return DEFAULT_API; } }
    var $ = function(id){ return document.getElementById(id); };
    var err = $('loginErr'), btn = $('btnLogin');
    function showErr(m){ err.textContent = m; err.style.display = 'block'; }
    function clearErr(){ err.style.display = 'none'; }

    // Destino pós-login: honra ?next= do requireAuth(), mas só caminhos
    // internos (começando com "/" e sem "//") pra evitar open redirect.
    // Default: dashboard.html, index.html é a landing (shadow no netlify.toml).
    function nextUrl(){
      try {
        var n = new URLSearchParams(location.search).get('next') || '';
        // mesmas regras do safeNext() do blaxx-app.js: path relativo, sem
        // protocol-relative (//) e sem esquema (:)
        if (n.charAt(0) === '/' && n.charAt(1) !== '/' && n.indexOf(':') === -1 && n.indexOf('\\') === -1) return n;
      } catch(e){}
      return 'dashboard.html';
    }

    // Grava a sessão nas DUAS formas: blaxx_session (formato desta página,
    // usado pelo index/Command Center) e blaxx_token/blaxx_user (formato que
    // o blaxx-app.js/STORE lê no dashboard e demais páginas do app). Sem as
    // duas, o requireAuth() do dashboard devolve pro login em loop.
    function saveSession(j){
      try {
        localStorage.setItem('blaxx_session', JSON.stringify(j));
        if (j.token) localStorage.setItem('blaxx_token', j.token);
        if (j.user) localStorage.setItem('blaxx_user', JSON.stringify(j.user));
        // O refresh token (30 dias) era descartado aqui. Sem ele, o access de
        // 30 min expirava e a primeira chamada seguinte tomava 401 → o usuário
        // era expulso no meio da navegação. Guardado, o blaxx-app.js renova em
        // silêncio e a sessão só termina quando se clica em "Sair".
        if (j.refresh_token) localStorage.setItem('blaxx_refresh', j.refresh_token);
      } catch(e){}
    }

    // Se já está logado, vai direto pro app. Sessões antigas gravaram só
    // blaxx_session, backfill das chaves do app antes de redirecionar.
    try {
      var _s = JSON.parse(localStorage.getItem('blaxx_session')||'null');
      if (_s && _s.token) { saveSession(_s); location.replace(nextUrl()); }
      else if (localStorage.getItem('blaxx_token')) location.replace(nextUrl());
    } catch(e){}

    function doLogin(){
      clearErr();
      var id = $('email').value.trim(), pw = $('pass').value;
      if (!id || !pw){ showErr('Informe e-mail/CPF e senha.'); return; }
      var body = { email: id, password: pw };
      var mfa = $('mfaCode'); if (mfa && mfa.value.trim()) body.mfa_code = mfa.value.trim();
      btn.disabled = true; var old = btn.textContent; btn.textContent = 'Entrando…';
      fetch(apiBase() + '/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
        .then(function(r){ return r.json().then(function(j){ return { s:r.status, j:j }; }); })
        .then(function(res){
          btn.disabled = false; btn.textContent = old;
          if (res.s === 200 && res.j.token){
            saveSession(res.j);
            location.href = nextUrl(); return;
          }
          if (res.s === 401 && res.j.mfa_required){ $('mfaWrap').style.display='block'; showErr('Informe o código de verificação (2FA).'); return; }
          if (res.j && res.j.mfa_challenge_token){ showErr('2FA por SMS ativo, conclua pelo app oficial.'); return; }
          if (res.s === 423){ showErr(res.j.error || 'Conta bloqueada temporariamente. Tente mais tarde.'); return; }
          showErr((res.j && res.j.error) || 'Não foi possível entrar.');
        })
        .catch(function(e){ btn.disabled = false; btn.textContent = old; showErr('Falha de conexão: ' + e.message); });
    }
    btn.addEventListener('click', doLogin);
    $('pass').addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });
    var mfaEl = $('mfaCode'); if (mfaEl) mfaEl.addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });
  })();
  </script>
