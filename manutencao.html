<style>
  /* Remendo local: em assets/blaxx-embarque.css o mesmo :root declara
     --warn:#F7EFD6 / --info:#DCE8F3 (fundo, vocabulário de assets/styles.css)
     e, mais abaixo, --warn:#7a5a00 / --info:#1b4a80 (texto, vocabulário da
     folha raiz). A segunda declaração vence e as pílulas .status ficam com
     fundo igual à cor do texto, ou seja, ilegíveis. Até isso ser corrigido
     lá, os dois fundos vão literais aqui; o texto segue o token, que não
     é sombreado. */
  .status.pendente { background:#F7EFD6; color:var(--warn-text); }
  .status.info { background:#DCE8F3; color:var(--info-text); }
</style>
