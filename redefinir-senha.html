<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlaXx · Redefinir senha</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

<!-- Tema "Embarque" (design 3a): entra DEPOIS da folha principal e vence a cascata. -->
<link rel="stylesheet" href="assets/blaxx-embarque.css">
<style>
  body { background: var(--paper); min-height: 100vh; display: flex; flex-direction: column; }
  /* Barra preta: a marca oficial tem "Bla" BRANCO e não sobrevive sobre o
     papel, medido aqui: 1,25:1 no "Bla" e 1,08:1 no "Xx", ou seja, a logo
     inteira era invisível nesta tela. O link auxiliar também estava em neon
     sobre claro (1,08:1). Sobre preto, ambos passam com folga.
     No tema Embarque esta barra faz o papel da barra utilitária (.bx-util):
     preta, texto no cinza da barra, sem a borda grossa do brutalismo. */
  .auth-top { display: flex; align-items: center; justify-content: space-between;
              gap: 16px; flex-wrap: wrap; padding: 18px 28px;
              background: var(--bx-ink); border-bottom: 0; }
  .auth-top img { height: 30px; width: auto; display: block; }
  .auth-top a.alt { font-size: 13.5px; font-weight: 600; color: var(--bx-bar-fg); }
  .auth-top a.alt b { color: var(--bx-neon); }   /* neon sobre preto: 14,5:1 */
  .auth-wrap { flex: 1; display: grid; place-items: center; padding: 24px; }
  .auth { width: 100%; max-width: 420px; padding: 36px; animation: rise .5s var(--ease-out) both; }
  .auth h1 { font-family: var(--font-display); font-weight: 900; font-size: 28px; letter-spacing: -0.02em; margin: 0 0 4px; }
  .auth .sub { font-size: 14px; color: var(--fg-muted); margin: 0 0 24px; }
  .f { margin-bottom: 16px; }
  .f label { display: block; font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-subtle); margin-bottom: 7px; }
  .f input { width: 100%; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--cream); padding: 13px 14px; font-family: var(--font-body); font-size: 14.5px; color: var(--fg); outline: none; transition: border-color .2s var(--ease), box-shadow .2s var(--ease); }
  /* Foco como na folha do tema: contorno tinta + anel neon translúcido. */
  .f input:focus { border-color: var(--bx-ink); box-shadow: 0 0 0 3px rgba(89,253,39,.35); }
  .msg { font-size: 13px; padding: 11px 13px; border-radius: var(--r-sm); margin-bottom: 14px; }
  /* Verde escuro legível sobre tinte claro (--ok/--ok-text da folha do tema):
     #5AB800 como cor de texto dava 2,3:1 e reprovava AA. */
  .msg.ok { background: var(--ok); border: 1px solid var(--bx-line); color: var(--ok-text); }
  .msg.err { background: rgba(224,72,61,.08); border: 1px solid rgba(224,72,61,.3); color: #c0392b; }
  .auth-foot { text-align: center; padding: 20px; font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); }
  .auth-foot a { text-decoration: underline; }
  /* ── Celular (≤ 880px) ──────────────────────────────────────────────
     Barra preta mais baixa, cartão a 16px das bordas e com 24px por
     dentro (o 36px do desktop comia um quinto da tela), formulário logo
     abaixo da barra em vez de flutuar no meio, campos a 16px (o iOS não
     amplia a tela ao focar) e cada link ou alvo com 44px de altura. Os
     links do rodapé seguem corridos; só ganham área de toque. */
  @media (max-width: 880px){
    .auth-top { padding: 8px 16px; gap: 8px 14px; min-height: 60px; }
    .auth-top a { display: inline-flex; align-items: center; min-height: 44px; }
    .auth-top a.alt { gap: .32em; }   /* o flex engole o espaço antes do <b> */
    .auth-wrap { padding: 16px 16px 24px; align-items: start; }
    .auth { padding: 24px 20px; }
    .auth h1 { font-size: 28px; }
    .auth .sub { font-size: 15px; }
    .f input { font-size: 16px; min-height: 48px; }
    .auth-foot { padding: 8px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
    .auth-foot a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 6px; }
  }
</style>

<body>
  <div class="auth-top">
    <a href="index.html" aria-label="BlaXx" style="display:flex;align-items:center;gap:10px;text-decoration:none">
      <img src="assets/marca/blaxx-simbolo-b.svg" alt="BlaXx"
           style="display:block;height:34px;width:auto">
    </a>
    <a class="alt" href="login.html">Voltar para <b>Entrar →</b></a>
  </div>

  <div class="auth-wrap">
    <div class="card auth">
      <h1>Definir nova senha.</h1>
      <p class="sub">Escolha uma senha forte (mínimo 7 caracteres).</p>
      <div id="msg" class="msg" style="display:none"></div>
      <div id="formWrap">
        <div class="f">
          <label for="pass">Nova senha</label>
          <input id="pass" type="password" placeholder="••••••••" autocomplete="new-password" minlength="7">
        </div>
        <div class="f">
          <label for="pass2">Confirmar senha</label>
          <input id="pass2" type="password" placeholder="••••••••" autocomplete="new-password" minlength="7">
        </div>
        <button id="btnReset" type="button" class="btn btn--dark btn--block">Salvar nova senha →</button>
      </div>
    </div>
  </div>

  <div class="auth-foot">© 2026 BlaXx · <a href="termos.html">TERMOS</a> · <a href="privacidade.html">PRIVACIDADE</a> · <a href="ajuda.html">AJUDA</a></div>

  <script src="assets/blaxx-config.js"></script>
  <script>
  (function(){
    var DEFAULT_API = (window.BLAXX_API || 'https://blaxx-pontos-exe.onrender.com');
    function apiBase(){ try { return (localStorage.getItem('blaxx_api_url') || DEFAULT_API).replace(/\/+$/,''); } catch(e){ return DEFAULT_API; } }
    var $ = function(id){ return document.getElementById(id); };
    var msg = $('msg'), btn = $('btnReset');
    function show(type, text){ msg.className = 'msg ' + type; msg.textContent = text; msg.style.display = 'block'; }

    // token vem na query (?token=), enviado por e-mail.
    var params = new URLSearchParams(location.search);
    var token = params.get('token') || '';
    if (!token){
      show('err', 'Link inválido ou incompleto. Solicite um novo em "Esqueci a senha".');
      $('formWrap').style.display = 'none';
    }

    function reset(){
      var pw = $('pass').value, pw2 = $('pass2').value;
      if (!pw || pw.length < 7){ show('err', 'A senha precisa ter no mínimo 7 caracteres.'); return; }
      if (pw !== pw2){ show('err', 'As senhas não conferem.'); return; }
      btn.disabled = true; var old = btn.textContent; btn.textContent = 'Salvando…';
      fetch(apiBase() + '/auth/reset-password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token: token, password: pw }) })
        .then(function(r){ return r.json().then(function(j){ return { s:r.status, j:j }; }); })
        .then(function(res){
          if (res.s === 200 && res.j.ok){
            show('ok', 'Senha redefinida. Redirecionando para o login…');
            $('formWrap').style.display = 'none';
            setTimeout(function(){ location.href = 'login.html'; }, 1600);
            return;
          }
          btn.disabled = false; btn.textContent = old;
          show('err', (res.j && res.j.error) || 'Não foi possível redefinir a senha.');
        })
        .catch(function(e){ btn.disabled = false; btn.textContent = old; show('err', 'Falha de conexão: ' + e.message); });
    }
    btn.addEventListener('click', reset);
    $('pass2').addEventListener('keydown', function(e){ if (e.key === 'Enter') reset(); });
  })();
  </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('service-worker.js').catch(function () {});
    });
  }
</script>
